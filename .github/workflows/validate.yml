name: Validate plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/storage.test.mjs
      - name: Check shell syntax and patch whitespace
        run: |
          bash -n setup.sh tests/workspaces.sh
          git diff --check
